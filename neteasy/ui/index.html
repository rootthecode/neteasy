<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetEasy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <div class="app">
    <header class="topbar glass">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7a5 5 0 1 0 5 5"/><circle cx="12" cy="12" r="1.6"/><path d="M12 12 20 4"/></svg>
        </div>
        <div>
          <h1>NetEasy</h1>
          <p id="netLabel" class="muted">Reading network…</p>
        </div>
      </div>
      <nav class="seg" id="viewSwitch" aria-label="View">
        <button class="active" data-view="devices">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Devices
        </button>
        <button data-view="tools">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-3-3 8-8-1.3-1.3a4 4 0 0 0-5-5z"/><path d="m3 21 6-6"/></svg>Tools
        </button>
      </nav>
      <div class="actions">
        <button class="btn ghost" id="btnRefresh" title="Re-read adapter, router &amp; ISP info">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Refresh
        </button>
        <button class="btn ghost" id="btnHealth" title="Ping router &amp; internet, time DNS">
          <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Test connection
        </button>
        <button class="btn ghost" id="btnExport" title="Save device list as CSV">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Export
        </button>
        <button class="btn primary" id="btnScan">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Scan network</span>
        </button>
      </div>
    </header>

    <section class="cards" id="cards"></section>

    <section class="devices glass" id="devicesView">
      <div class="devices-head">
        <div class="title">
          <h2>Devices <span id="devCount" class="count">0</span></h2>
          <p id="scanStatus" class="muted">Press <b>Scan network</b> to discover everything on this LAN.</p>
        </div>
        <button class="chip live" id="btnLive"><span class="pulse"></span>Live</button>
        <div class="filters" id="filters"></div>
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="search" placeholder="Search IP, name, MAC, vendor…" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <div class="progress" id="progress"><div id="progressBar"></div></div>
      <div class="notice hidden" id="scanNote"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Device</th><th>IP address</th><th>MAC / vendor</th><th>Services</th><th class="num">Latency</th></tr>
          </thead>
          <tbody id="devBody"></tbody>
        </table>
        <div id="empty" class="empty">
          <div class="radar"><span></span><span></span><span></span></div>
          <p>No devices yet</p>
        </div>
      </div>
    </section>

    <section class="toolsview glass hidden" id="toolsView">
      <nav class="tool-list" id="toolList" aria-label="Tools"></nav>
      <div class="tool-main">
        <header class="tool-head">
          <h2 id="toolTitle"></h2>
          <p id="toolDesc" class="muted"></p>
        </header>
        <form id="toolForm" class="tool-form" autocomplete="off"></form>
        <div class="stats" id="toolStats"></div>
        <div class="console" id="toolOut"></div>
      </div>
    </section>
  </div>

  <aside id="drawer" class="drawer glass" aria-hidden="true"></aside>
  <div id="toast" class="toast glass"></div>

  <script src="app.js"></script>
  <script src="tools.js"></script>
</body>
</html>
